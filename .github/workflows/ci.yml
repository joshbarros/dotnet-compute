name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: compute_test
          POSTGRES_USER: compute
          POSTGRES_PASSWORD: compute
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U compute"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      COMPUTE_TEST_DB: "Host=localhost;Port=5432;Database=compute_test;Username=compute;Password=compute"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: npm ci
      - run: dotnet restore Compute.sln
      - run: npm run format:check
      - run: dotnet test tests/api/Compute.Api.Tests.csproj --no-restore
      - run: npx nx run-many -t typecheck lint -p web
      - run: npx nx run-many -t build -p web api

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Build and start the Compose stack
        run: docker compose up --build --wait --wait-timeout 420
      - name: Smoke
        run: ./scripts/smoke.sh
      - name: Browser specs
        run: npx playwright test
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color --tail=300
      - name: Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          if-no-files-found: ignore
      - name: Stop the stack
        if: always()
        run: docker compose down -v
